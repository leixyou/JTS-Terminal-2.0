name: Sandbox ssh-agent probe

# Temporary measurement: can JTS Terminal's App Sandbox reach an ssh-agent?
# Runs scripts/sandbox_probes/run_ssh_agent_probe.sh on hosted macOS. It builds
# no app, uses no signing identity and needs no secrets.
on:
  push:
    branches:
      - claude/charming-edison-lvupnd
    paths:
      - scripts/sandbox_probes/**
      - .github/workflows/sandbox-ssh-agent-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run probe
        env:
          # Hosted runners are disposable: allow the throwaway launchd-agent key
          # and the temporary key-only sshd used for the real login check.
          JTS_PROBE_ALLOW_SYSTEM_CHANGES: "1"
        run: bash scripts/sandbox_probes/run_ssh_agent_probe.sh
